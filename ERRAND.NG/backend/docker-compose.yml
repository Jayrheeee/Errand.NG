version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: errand_ng
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/errand_ng
      SECRET_KEY: super-secret-key-change-in-prod
    depends_on:
      - db
    volumes:
      - .:/app

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
